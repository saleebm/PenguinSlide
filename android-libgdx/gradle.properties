org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.caching=true
kotlin.code.style=official

# The Android Gradle Plugin does not support JDK 23; build the whole project on JDK 17
# (desktop targets 17 bytecode too, so this is consistent across modules).
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# AndroidX + Jetifier (libGDX android backend is AndroidX-compatible).
android.useAndroidX=true
