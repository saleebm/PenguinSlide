org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.caching=true
kotlin.code.style=official

# The Android Gradle Plugin does not support JDK 23, so every module pins a Java 17
# toolchain (see each build.gradle.kts). Gradle locates an installed JDK 17 — or downloads
# one via the foojay resolver in settings.gradle.kts — regardless of the host machine, so
# the build is portable across macOS/Linux/Windows/CI. Do NOT hardcode org.gradle.java.home
# here: it pins one machine's JDK path and breaks the build everywhere else.

# AndroidX + Jetifier (libGDX android backend is AndroidX-compatible).
android.useAndroidX=true
